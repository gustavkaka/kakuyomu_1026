<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マイ・カクヨム</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B0C">
<style>
:root {
  --bg: #0B0B0C;
  --surface: #16161a;
  --surface2: #1e1e24;
  --border: rgba(255,255,255,.08);
  --accent: #e5a93c;
  --accent2: #c97b2d;
  --danger: #ff4d4f;
  --text: #f0f0f2;
  --sub: #a0a0ab;
  --muted: #62626e;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; overflow-x: hidden; padding-bottom: 110px;
}
button { font-family: inherit; cursor: pointer; }
select, input, textarea { font-family: inherit; }

/* スプラッシュ */
#splash {
  position: fixed; inset: 0; z-index: 300;
  background: radial-gradient(120% 90% at 50% 0%, #23202a 0%, var(--bg) 60%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  transition: opacity .5s ease, visibility .5s;
}
#splash.hide { opacity: 0; visibility: hidden; }
.splash-mark {
  width: 74px; height: 74px; border-radius: 20px;
  background: linear-gradient(140deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 2rem; font-weight: 700; color: #191104;
  box-shadow: 0 14px 40px rgba(229,169,60,.35);
  animation: splashIn .6s cubic-bezier(.16,1,.3,1);
}
.splash-name { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.35rem; letter-spacing: .14em; animation: splashIn .6s .08s both; }
.splash-sub { font-size: .75rem; color: var(--sub); letter-spacing: .3em; animation: splashIn .6s .16s both; }
@keyframes splashIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }

/* ヘッダー */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(11,11,12,.86); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  transition: padding .25s ease;
}
header.shrunk { padding: 8px 16px; }
.h-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.18rem; font-weight: 700; letter-spacing: .06em; cursor: pointer; white-space: nowrap; }
.h-title .h-accent { color: var(--accent); }
.h-actions { display: flex; gap: 8px; }
.h-btn {
  background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text);
  border-radius: 999px; padding: 8px 14px; font-size: .8rem; font-weight: 600;
  transition: transform .1s, background .2s;
}
.h-btn:active { transform: scale(.93); background: rgba(255,255,255,.12); }
main { max-width: 680px; margin: 0 auto; padding: 16px; width: 100%; }

/* ヒーロー統計 */
.hero {
  border: 1px solid rgba(229,169,60,.28); border-radius: 20px; padding: 18px; margin-bottom: 18px;
  background: linear-gradient(150deg, rgba(229,169,60,.16), rgba(201,123,45,.05) 55%, rgba(255,255,255,.02));
  animation: fadeUp .5s both;
}
.hero-label { font-size: .7rem; letter-spacing: .28em; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
.hero-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-stat { flex: 1; min-width: 88px; }
.hero-num { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.45rem; font-weight: 700; line-height: 1.15; }
.hero-cap { font-size: .68rem; color: var(--sub); margin-top: 2px; }
.hero-msg { margin-top: 12px; font-size: .82rem; color: var(--sub); line-height: 1.6; }

/* 続きを読む＆本棚 */
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 2px 10px; }
.section-head h2 { font-size: .95rem; letter-spacing: .08em; }
.section-head .hint { font-size: .7rem; color: var(--muted); }
.continue-card {
  display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px; cursor: pointer; animation: fadeUp .5s both; transition: transform .12s;
}
.continue-card:active { transform: scale(.98); }
.continue-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.continue-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
.continue-meta { font-size: .72rem; color: var(--sub); }
.progress-track { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: auto; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; }
.continue-btn { align-self: flex-start; background: var(--accent); color: #191104; border: none; font-weight: 700; font-size: .8rem; border-radius: 999px; padding: 8px 16px; margin-top: 8px; }

.cover {
  flex: none; width: 74px; height: 104px; border-radius: 6px 12px 12px 6px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 4px 0 8px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.4);
}
.cover::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.35); }
.cover-title {
  writing-mode: vertical-rl; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700;
  font-size: .82rem; color: rgba(255,255,255,.96); letter-spacing: .08em;
  max-height: 88px; overflow: hidden; text-shadow: 0 1px 4px rgba(0,0,0,.45); padding: 6px 0;
}
.cover-lg { width: 96px; height: 136px; }
.cover-lg .cover-title { font-size: 1rem; max-height: 116px; }
.cover-sm { width: 46px; height: 64px; }
.cover-sm .cover-title { font-size: .58rem; max-height: 52px; }

.shelf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.book-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px;
  cursor: pointer; animation: fadeUp .45s both; transition: transform .12s;
  display: flex; flex-direction: column; gap: 10px;
}
.book-card:active { transform: scale(.97); }
.book-top { display: flex; gap: 10px; }
.book-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.book-title {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: .92rem; font-weight: 700; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.book-meta { font-size: .68rem; color: var(--sub); line-height: 1.5; }
.book-snippet { font-size: .74rem; color: var(--sub); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: .66rem; color: var(--sub); background: rgba(255,255,255,.05); padding: 2px 7px; border-radius: 4px; }
.book-foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.mini-progress { flex: 1; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
.mini-progress i { display: block; height: 100%; background: var(--accent); }
.pct { font-size: .66rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
.done-badge { font-size: .66rem; color: #7dd87d; font-weight: 700; white-space: nowrap; }
.card-btn { background: none; border: none; color: var(--muted); font-size: .85rem; padding: 4px 6px; border-radius: 6px; }
.card-btn.fav-on { color: #ff6b81; }
.card-btn.edit { font-size: .72rem; }
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-row.wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text);
  border-radius: 999px; padding: 7px 13px; font-size: .78rem; transition: transform .1s;
}
.chip:active { transform: scale(.94); }
.chip.active { background: rgba(229,169,60,.16); border-color: var(--accent); color: var(--accent); }
.chip .badge { background: rgba(255,255,255,.12); border-radius: 8px; padding: 0 6px; font-size: .68rem; font-weight: 700; }
.chip.active .badge { background: var(--accent); color: #191104; }
.sort-select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: .75rem; }
.empty { text-align: center; padding: 70px 24px; color: var(--muted); animation: fadeUp .5s both; }
.empty .big { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.05rem; color: var(--sub); margin-bottom: 8px; }
.empty p { font-size: .82rem; line-height: 1.7; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

#fab {
  position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom));
  width: 60px; height: 60px; border-radius: 50%; border: none; z-index: 60;
  background: linear-gradient(140deg, var(--accent), var(--accent2)); color: #191104;
  font-size: 1.7rem; font-weight: 700; box-shadow: 0 12px 30px rgba(229,169,60,.4);
  display: flex; align-items: center; justify-content: center; transition: transform .12s;
}
#fab:active { transform: scale(.9); }

/* 全画面スクリーン共通 */
.screen {
  position: fixed; inset: 0; background: var(--bg); z-index: 100;
  transform: translateX(100%); transition: transform .28s cubic-bezier(.16,1,.3,1);
  display: flex; flex-direction: column; visibility: hidden;
}
.screen.active { transform: none; visibility: visible; }
.screen-head {
  flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px;
  border-bottom: 1px solid var(--border); background: rgba(11,11,12,.9);
  backdrop-filter: blur(12px); position: relative;
}
.screen-head .ttl { flex: 1; font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back-btn { background: none; border: none; color: var(--accent); font-size: .92rem; font-weight: 700; padding: 8px 6px; white-space: nowrap; }
.head-btn { background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: .76rem; font-weight: 600; white-space: nowrap; }
.head-btn:active { transform: scale(.93); }
.screen-body { flex: 1; overflow-y: auto; padding: 16px; max-width: 680px; width: 100%; margin: 0 auto; }

/* 検索 */
.search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; color: #fff; font-size: 1rem; outline: none; }
.search-input:focus { border-color: var(--accent); }
.result-row {
  display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px; margin-bottom: 10px; cursor: pointer; animation: fadeUp .35s both;
}
.result-row:active { transform: scale(.98); }
.result-info { flex: 1; min-width: 0; }
.result-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; font-size: .95rem; margin-bottom: 4px; }
.result-snippet { font-size: .76rem; color: var(--sub); line-height: 1.6; }
.result-meta { font-size: .68rem; color: var(--muted); margin-top: 4px; }

/* 分類・設定 */
.group-label { font-size: .72rem; letter-spacing: .2em; color: var(--muted); font-weight: 700; margin: 22px 0 10px; }
.group-label:first-child { margin-top: 0; }
.data-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 12px; padding: 14px; font-size: .86rem; margin-bottom: 10px;
}
.data-btn small { color: var(--muted); font-size: .7rem; }
.data-btn:active { transform: scale(.98); }
.data-btn.danger { color: var(--danger); }

/* 編集 */
.form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.form-group label { font-size: .78rem; color: var(--sub); font-weight: 700; letter-spacing: .04em; }
.text-input { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: #fff; font-size: .95rem; outline: none; width: 100%; }
.text-input:focus { border-color: var(--accent); }
textarea.text-input { min-height: 260px; resize: none; line-height: 1.7; }
.editor-count { font-size: .72rem; color: var(--muted); text-align: right; }
.new-tag-row { display: flex; gap: 8px; }
.new-tag-row .text-input { flex: 1; }
.add-tag-btn { background: rgba(255,255,255,.08); border: 1px solid var(--border); color: #fff; padding: 0 16px; border-radius: 10px; font-size: .85rem; white-space: nowrap; }
.save-btn { background: var(--accent); color: #191104; border: none; font-weight: 700; font-size: .86rem; border-radius: 999px; padding: 9px 20px; }
.save-btn:active { transform: scale(.94); }

/* 読書画面 */
#readerView.theme-sepia { background: #f3e9d2; color: #2b2118; }
#readerView.theme-paper { background: #fbfbf8; color: #22242a; }
#readerView.theme-sepia .screen-head, #readerView.theme-paper .screen-head { background: rgba(255,255,255,.55); }
#readerView.theme-sepia .head-btn, #readerView.theme-paper .head-btn { color: #333; border-color: rgba(0,0,0,.15); }
.reader-progress { position: absolute; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); z-index: 5; }
.reader-body { flex: 1; overflow-y: auto; padding: 22px 20px 90px; max-width: 720px; width: 100%; margin: 0 auto; }
.reader-kicker { font-size: .68rem; letter-spacing: .3em; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
.reader-title { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.5rem; font-weight: 700; line-height: 1.45; margin-bottom: 10px; }
.reader-meta { font-size: .74rem; color: var(--sub); margin-bottom: 6px; line-height: 1.7; }
#readerView.theme-sepia .reader-meta, #readerView.theme-paper .reader-meta { color: #7a6a52; }
.reader-rule { height: 1px; background: var(--border); margin: 18px 0 24px; }
#readerView.theme-sepia .reader-rule { background: #d8c9a6; }
#readerView.theme-paper .reader-rule { background: #ddd; }
.reader-content { font-size: 17px; line-height: 1.9; letter-spacing: .02em; }
.reader-content.font-serif { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; }
.reader-content p { margin-bottom: .75em; word-break: break-word; }
.reader-content h3.chapter {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1.22em; font-weight: 700;
  margin: 1.7em 0 .9em; padding-left: 10px; border-left: 4px solid var(--accent); line-height: 1.5;
}
.reader-content p.hit { background: rgba(229,169,60,.25); border-radius: 4px; }
.reader-end { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 44px; letter-spacing: .2em; }
.toc-row {
  display: flex; justify-content: space-between; gap: 10px; width: 100%;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 12px; padding: 13px 14px; font-size: .88rem; margin-bottom: 8px; text-align: left;
}
.toc-row small { color: var(--muted); white-space: nowrap; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
.set-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.seg { display: flex; gap: 6px; }
.seg button { background: var(--surface2); border: 1px solid var(--border); color: var(--sub); border-radius: 8px; padding: 7px 11px; font-size: .76rem; }
.seg button.on { background: rgba(229,169,60,.16); border-color: var(--accent); color: var(--accent); font-weight: 700; }

/* シート＆トースト */
#sheetBackdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s; }
#sheetBackdrop.open { opacity: 1; pointer-events: auto; }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; background: #17171c; border-radius: 20px 20px 0 0;
  padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .28s cubic-bezier(.16,1,.3,1);
  max-height: 78vh; overflow-y: auto; max-width: 680px; margin: 0 auto; color: var(--text);
}
#sheetBackdrop.open #sheet { transform: none; }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); margin: 2px auto 14px; }
.sheet-title { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
.sheet-msg { font-size: .85rem; color: var(--sub); line-height: 1.7; margin-bottom: 16px; }
.sheet-btn { width: 100%; border: none; border-radius: 12px; padding: 14px; font-size: .92rem; font-weight: 700; margin-bottom: 10px; background: var(--surface2); color: var(--text); }
.sheet-btn.danger { background: rgba(255,77,79,.14); color: var(--danger); }
#toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px); background: #26262e; border: 1px solid var(--border); color: var(--text);
  font-size: .82rem; padding: 11px 18px; border-radius: 999px; z-index: 250; opacity: 0; pointer-events: none;
  transition: all .3s cubic-bezier(.16,1,.3,1); box-shadow: 0 10px 30px rgba(0,0,0,.5);
  white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="splash">
  <div class="splash-mark">書</div>
  <div class="splash-name">マイ・カクヨム</div>
  <div class="splash-sub">PRIVATE LIBRARY</div>
</div>

<header id="appHeader">
  <div class="h-title" id="homeTitle">マイ・<span class="h-accent">カクヨム</span></div>
  <div class="h-actions">
    <button class="h-btn" id="randomBtn">今日の一冊</button>
    <button class="h-btn" id="openSearchBtn">検索</button>
    <button class="h-btn" id="openTagsBtn">分類・設定</button>
  </div>
</header>

<main id="homeMain">
  <section class="hero" id="heroBox"></section>
  <div id="continueWrap"></div>
  <div class="section-head">
    <h2>本棚</h2>
    <select class="sort-select" id="sortSelect">
      <option value="new">新しい順</option>
      <option value="recentRead">最近読んだ順</option>
      <option value="long">長い順</option>
      <option value="title">タイトル順</option>
    </select>
  </div>
  <div class="filter-row" id="filterRow"></div>
  <div class="shelf-grid" id="shelfGrid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="big">まだ本棚が空ですわ</div>
    <p>右下の＋から、読みたい作品をペタッと貼ってくださいまし。<br>貼った瞬間から、表紙のある本として並びますわ。</p>
  </div>
</main>

<button id="fab" title="作品を追加">＋</button>

<div class="screen" id="searchView">
  <div class="screen-head">
    <button class="back-btn" data-back>← 戻る</button>
    <div class="ttl">検索</div>
  </div>
  <div class="screen-body">
    <input class="search-input" id="searchInput" type="text" placeholder="タイトル・タグ・本文の場面から探す">
    <div style="height:14px"></div>
    <div id="searchResults"></div>
  </div>
</div>

<div class="screen" id="tagsView">
  <div class="screen-head">
    <button class="back-btn" data-back>← 戻る</button>
    <div class="ttl">分類・設定</div>
  </div>
  <div class="screen-body">
    <div class="group-label">タグ（件数順）</div>
    <div class="filter-row wrap" id="allTagRow"></div>
    <div class="group-label">データ管理</div>
    <button class="data-btn" id="exportBtn"><span>バックアップを書き出す</span><small>JSON</small></button>
    <button class="data-btn" id="importBtn"><span>バックアップから復元する</span><small>JSON</small></button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    <div class="group-label">この書庫について</div>
    <div id="aboutBox" style="font-size:.8rem;color:var(--sub);line-height:1.8"></div>
  </div>
</div>

<div class="screen" id="editorView">
  <div class="screen-head">
    <button class="back-btn" data-back>キャンセル</button>
    <div class="ttl" id="editorTitle">新規作品</div>
    <button class="save-btn" id="saveBtn">保存</button>
  </div>
  <div class="screen-body">
    <div class="form-group">
      <label>タイトル</label>
      <input class="text-input" id="inputTitle" type="text" placeholder="タイトルを入力">
    </div>
    <div class="form-group">
      <label>タグ</label>
      <div class="filter-row wrap" id="editorTagRow" style="padding:0"></div>
      <div class="new-tag-row">
        <input class="text-input" id="inputNewTag" type="text" placeholder="新しいタグを手打ちで追加">
        <button class="add-tag-btn" id="addTagBtn">＋追加</button>
      </div>
    </div>
    <div class="form-group">

<script>
'use strict';
/* ===== 純粋関数（テスト対象） ===== */
function escapeHtml(str) {
return String(str == null? '': str)
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;')
.replace(/'/g, '&#039;');
}
function hashCode(str) {
let h = 0;
const s = String(str || '');
for (let i = 0; i < s.length; i++) {
h = (h * 31 + s.charCodeAt(i)) | 0;
}
return Math.abs(h);
}
function coverHue(title) {
return hashCode(title || '無題') % 360;
}
function formatChars(n) {
const v = Number(n) || 0;
if (v >= 10000) {
return (Math.round(v / 1000) / 10).toLocaleString('ja-JP') + '万字';
}
return v.toLocaleString('ja-JP') + '字';
}
function estimateMinutes(chars) {
return Math.max(1, Math.round((Number(chars) || 0) / 600));
}
function isChapterLine(line) {
const t = String(line || '').trim();
if (!t || t.length > 40) {
return false;
}
if (/^第[0-9０-９一二三四五六七八九十百千]+[章話節幕編回]/.test(t)) {
return true;
}
if (/^(プロローグ|エピローグ|序章|終章|あとがき|幕間)/.test(t)) {
return true;
}
if (/^【.+】$/.test(t)) {
return true;
}
if (/^■\s*\S/.test(t)) {
return true;
}
if (/^Chapter\s+\d+/i.test(t)) {
return true;
}
return false;
}
function detectChapters(body) {
const lines = String(body || '').split('\n');
const chapters = [];
let offset = 0;
lines.forEach((line, idx) => {
if (isChapterLine(line)) {
chapters.push({ title: line.trim(), lineIndex: idx, index: offset});
}
offset += line.length + 1;
});
return chapters;
}
function tagsWithCount(novels) {
const counts = {};
(novels || []).forEach((n) => {
(n.tags || []).forEach((t) => {
counts[t] = (counts[t] || 0) + 1;
});
});
return Object.keys(counts)
.map((tag) => ({ tag, count: counts[tag]}))
.sort((a, b) => (b.count - a.count) || a.tag.localeCompare(b.tag, 'ja'));
}
function searchNovels(novels, query) {
const q = String(query || '').trim().toLowerCase();
if (!q) {
return [];
}
return (novels || []).filter((n) => {
if (String(n.title || '').toLowerCase().includes(q)) {
return true;
}
if ((n.tags || []).some((t) => String(t).toLowerCase().includes(q))) {
return true;
}
return String(n.body || '').toLowerCase().includes(q);
});
}
function snippetFor(body, query, radius) {
const text = String(body || '').replace(/\s+/g, ' ');
const r = radius || 48;
const q = String(query || '').trim();
if (!q) {
return text.slice(0, r * 2);
}
const i = text.toLowerCase().indexOf(q.toLowerCase());
if (i < 0) {
return text.slice(0, r * 2);
}
const start = Math.max(0, i - r);
const end = Math.min(text.length, i + q.length + r);
return (start > 0? '…': '') + text.slice(start, end) + (end < text.length? '…': '');
}
function sortNovels(novels, mode, meta) {
const arr = (novels || []).slice();
const prog = (meta && meta.progress) || {};
if (mode === 'title') {
arr.sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'ja'));
} else if (mode === 'long') {
arr.sort((a, b) => String(b.body || '').length - String(a.body || '').length);
} else if (mode === 'recentRead') {
arr.sort((a, b) => {
const ta = (prog[a.id] && prog[a.id].lastReadAt) || 0;
const tb = (prog[b.id] && prog[b.id].lastReadAt) || 0;
if (tb!== ta) {
return tb - ta;
}
return (b.id || 0) - (a.id || 0);
});
} else {
arr.sort((a, b) => (b.id || 0) - (a.id || 0));
}
return arr;
}
function parseImport(text) {
const data = JSON.parse(text);
if (!Array.isArray(data)) {
throw new Error('not-array');
}
const out = [];
data.forEach((item) => {
if (!item || typeof item!== 'object') {
return;
}
const body = typeof item.body === 'string'? item.body: '';
if (!body.trim()) {
return;
}
const tags = Array.isArray(item.tags)
? item.tags.filter((t) => typeof t === 'string' && t.trim()).map((t) => t.trim())
: [];
out.push({
title: (typeof item.title === 'string' && item.title.trim())? item.title: '無題の作品',
tags: tags,
body: body,
createdAt: (typeof item.createdAt === 'string')? item.createdAt: new Date().toISOString()
});
});
return out;
}
function progressPercent(entry) {
if (!entry || typeof entry.ratio!== 'number') {
return 0;
}
return Math.max(0, Math.min(100, Math.round(entry.ratio * 100)));
}
</script>

<script>
'use strict';
/* ===== アプリ本体 ===== */
const DB_NAME = 'EroNovelLibraryDB';
const DB_VERSION = 1;
const STORE_NAME = 'novels';
const META_KEY = 'mykakuyomu_meta_v1';
let db = null;
let novels = [];
let currentTagFilter = null;
let sortMode = 'new';
let editingId = null;
let editorTags = new Set();
let currentReaderId = null;

const $ = (id) => document.getElementById(id);
const els = {};
['appHeader','homeTitle','randomBtn','openSearchBtn','openTagsBtn','heroBox','continueWrap','sortSelect','filterRow','shelfGrid','emptyState','fab','searchView','searchInput','searchResults','tagsView','allTagRow','exportBtn','importBtn','importFile','aboutBox','editorView','editorTitle','saveBtn','inputTitle','inputBody','bodyCount','editorTagRow','inputNewTag','addTagBtn','deleteWrap','deleteBtn','readerView','readerBody','readerProgress','readerHeadTitle','readerTitle','readerTags','readerMeta','readerContent','tocBtn','readerFavBtn','readerSetBtn','readerEditBtn','sheetBackdrop','sheetContent','toast'].forEach((id) => { els[id] = $(id); });

}
function vibrate(ms) {

function showToast(msg) {

/* メタ情報（進捗・お気に入り・設定・下書き）は作品データと別枠で localStorage に保存 */
function defaultMeta() {
  return { progress: {}, favorites: [], settings: { fontSize: 17, lineHeight: 1.9, font: 'serif', theme: 'dark' }, draft: null };
}
function loadMeta() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (!raw) return defaultMeta();
    const m = JSON.parse(raw);
    const d = defaultMeta();
    return {
      progress: m.progress || {},
      favorites: Array.isArray(m.favorites) ? m.favorites : [],
      settings: Object.assign(d.settings, m.settings || {}),
      draft: m.draft || null
    };
  } catch (e) { return defaultMeta(); }
}
let meta = loadMeta();
function saveMeta() {
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {}
}
function isFav(id) { return meta.favorites.includes(id); }
function toggleFav(id) {
  if (isFav(id)) {
    meta.favorites = meta.favorites.filter((x) => x !== id);
  } else {
    meta.favorites.push(id);
    vibrate(25);
  }
  saveMeta();
}

/* IndexedDB（従来と完全同一の形式） */
function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) {
        d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function getAllNovels() {
  return new Promise((resolve) => {
    const store = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
  });
}
function saveOrUpdateNovel(novel) {
  return new Promise((resolve) => {
    const store = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME);
    const req = store.put(novel);
    req.onsuccess = () => resolve(req.result);
  });
}
function deleteNovelById(id) {
  return new Promise((resolve) => {
    const store = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
  });
}

window.addEventListener('touchstart', (e) => {

/* 表紙 */
function makeCover(novel, sizeCls) {
  const hue = coverHue(novel.title || '');
  const cover = h('div', 'cover ' + (sizeCls || ''));
  cover.style.background = 'linear-gradient(155deg, hsl(' + hue + ',48%,40%), hsl(' + ((hue + 45) % 360) + ',55%,20%))';

}
function novelMetaLine(novel) {

els.exportBtn.addEventListener('click', () => {
  if (!novels.length) { showToast('書き出す作品がありませんわ'); return; }
  const blob = new Blob([JSON.stringify(novels, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'my_novels_backup_' + new Date().toISOString().split('T')[0] + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('バックアップを書き出しましたわ');
});
els.importBtn.addEventListener('click', () => els.importFile.click());
els.importFile.addEventListener('change', async () => {
  const file = els.importFile.files[0];
  els.importFile.value = '';
  if (!file) return;
  try {
    const items = parseImport(await file.text());
    let added = 0;
    let skipped = 0;
    for (const item of items) {
      const dup = novels.some((n) => n.title === item.title && n.body === item.body);
      if (dup) { skipped++; continue; }
      await saveOrUpdateNovel(item);
      added++;
    }
    await reloadNovels();
    renderTagsView();
    renderHome();
    showToast(added + '冊を復元しましたわ' + (skipped ? '（重複' + skipped + '冊はスキップ）' : ''));
    vibrate(40);
  } catch (e) {
    showToast('復元できませんでしたわ……JSONの形式をご確認くださいまし');
  }
});
</script>

<script>
'use strict';
/* ===== 編集 ===== */
function renderEditorTags() {
  els.editorTagRow.textContent = '';
  const map = new Map();
  tagsWithCount(novels).forEach((t) => map.set(t.tag, t.count));
  editorTags.forEach((t) => { if (!map.has(t)) map.set(t, 0); });
  if (!map.size) {
    els.editorTagRow.appendChild(h('span', null, 'まだタグがありませんわ'));
    return;
  }
  map.forEach((count, tag) => {
    const chip = h('button', 'chip' + (editorTags.has(tag) ? ' active' : ''), '#' + tag);
    if (count > 0) chip.appendChild(h('span', 'badge', String(count)));
    chip.addEventListener('click', () => {
      if (editorTags.has(tag)) editorTags.delete(tag); else editorTags.add(tag);
      renderEditorTags();
      scheduleDraftSave();
    });
    els.editorTagRow.appendChild(chip);
  });
}
function updateBodyCount() {
  const len = els.inputBody.value.length;
  const ch = detectChapters(els.inputBody.value).length;
  els.bodyCount.textContent = len.toLocaleString('ja-JP') + '字' + (ch ? ' ・ ' + ch + '章を検出' : '');
}
let draftTimer = null;
function scheduleDraftSave() {
  if (editingId != null) return;
  if (draftTimer) clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    meta.draft = { title: els.inputTitle.value, tags: Array.from(editorTags), body: els.inputBody.value };
    saveMeta();
  }, 500);
}
els.inputBody.addEventListener('input', () => { updateBodyCount(); scheduleDraftSave(); });
els.inputTitle.addEventListener('input', scheduleDraftSave);
els.addTagBtn.addEventListener('click', () => {
  const t = els.inputNewTag.value.trim();
  if (!t) return;
  editorTags.add(t);
  els.inputNewTag.value = '';
  renderEditorTags();
  scheduleDraftSave();
});
function openEditor(novel) {
  editingId = novel ? novel.id : null;
  els.editorTitle.textContent = novel ? '作品の編集' : '新規作品';
  els.deleteWrap.style.display = novel ? 'block' : 'none';
  editorTags = new Set(novel ? (novel.tags || []) : []);
  els.inputTitle.value = novel ? (novel.title || '') : '';
  els.inputBody.value = novel ? (novel.body || '') : '';
  els.inputNewTag.value = '';
  if (!novel && meta.draft && (meta.draft.body || meta.draft.title)) {
    els.inputTitle.value = meta.draft.title || '';
    els.inputBody.value = meta.draft.body || '';
    editorTags = new Set(meta.draft.tags || []);
    setTimeout(() => showToast('下書きを復元しましたわ'), 350);
  }
  renderEditorTags();
  updateBodyCount();
  pushScreen('editor');
}
els.fab.addEventListener('click', () => openEditor(null));
els.saveBtn.addEventListener('click', async () => {
  const title = els.inputTitle.value.trim() || '無題の作品';
  const body = els.inputBody.value;
  if (!body.trim()) { showToast('本文を入れてくださいまし'); return; }
  const wasEdit = editingId != null;
  const data = { title: title, tags: Array.from(editorTags), body: body, createdAt: new Date().toISOString() };
  if (wasEdit) {
    const old = novels.find((n) => n.id === editingId);
    if (old && old.createdAt) data.createdAt = old.createdAt;
    data.updatedAt = new Date().toISOString();
    data.id = editingId;
  }
  await saveOrUpdateNovel(data);
  if (!wasEdit) { meta.draft = null; saveMeta(); }
  await reloadNovels();
  renderHome();
  history.back();
  showToast(wasEdit ? '保存しましたわ' : '本棚に並べましたわ');
  vibrate(40);
});
els.deleteBtn.addEventListener('click', () => {
  if (editingId == null) return;
  const id = editingId;
  showConfirm('この作品を削除しますか？', '本棚から完全に消えますわ。バックアップを取っていない場合は戻せませんの。', '削除する', async () => {
    await deleteNovelById(id);
    delete meta.progress[id];
    meta.favorites = meta.favorites.filter((x) => x !== id);
    saveMeta();
    if (currentReaderId === id) currentReaderId = null;
    await reloadNovels();
    renderHome();
    history.back();
    showToast('削除しましたわ');
  });
});

/* ===== 読書 ===== */
function applyReaderSettings() {
  const s = meta.settings;
  els.readerContent.style.fontSize = s.fontSize + 'px';
  els.readerContent.style.lineHeight = String(s.lineHeight);
  els.readerContent.classList.toggle('font-serif', s.font !== 'sans');
  els.readerView.classList.remove('theme-sepia', 'theme-paper');
  if (s.theme === 'sepia') els.readerView.classList.add('theme-sepia');
  if (s.theme === 'paper') els.readerView.classList.add('theme-paper');
}
function buildReader(novel) {
  els.readerHeadTitle.textContent = novel.title || '無題の作品';
  els.readerTitle.textContent = novel.title || '無題の作品';
  els.readerTags.textContent = '';
  (novel.tags || []).forEach((t) => els.readerTags.appendChild(h('span', 'tag', '#' + t)));
  const dateStr = novel.createdAt ? new Date(novel.createdAt).toLocaleDateString('ja-JP') : '';
  els.readerMeta.textContent = novelMetaLine(novel) + (dateStr ? ' ・ 登録 ' + dateStr : '');
  els.readerFavBtn.textContent = isFav(novel.id) ? '♥' : '♡';
  els.readerContent.textContent = '';
  currentChapters = [];
  String(novel.body || '').split('\n').forEach((line) => {
    if (isChapterLine(line)) {
      const hd = h('h3', 'chapter', line.trim());
      currentChapters.push({ title: line.trim(), el: hd });
      els.readerContent.appendChild(hd);
    } else if (line.trim() !== '') {
      els.readerContent.appendChild(h('p', null, line));
    }
  });
  applyReaderSettings();
}
function openReader(id, hitQuery) {
  const novel = novels.find((n) => n.id === id);
  if (!novel) return;
  currentReaderId = id;
  pendingHitQuery = hitQuery || null;
  buildReader(novel);
  pushScreen('reader');
  requestAnimationFrame(() => {
    setTimeout(() => {
      if (pendingHitQuery) {
        const q = pendingHitQuery.toLowerCase();
        const target = Array.from(els.readerContent.querySelectorAll('p')).find((p) => p.textContent.toLowerCase().includes(q));
        if (target) {
          target.scrollIntoView({ block: 'center' });
          target.classList.add('hit');
          setTimeout(() => target.classList.remove('hit'), 1800);
          showToast('探していた場面ですわ');
        }
        pendingHitQuery = null;
      } else {
        const saved = meta.progress[id];
        if (saved && saved.ratio > 0.02 && saved.ratio <= 0.98 && saved.scroll) {
          els.readerBody.scrollTop = saved.scroll;
          showToast('前回の続きから開きましたわ（' + progressPercent(saved) + '%）');
        } else {
          els.readerBody.scrollTop = 0;
        }
      }
      updateReaderProgress();
    }, 60);
  });
}
function updateReaderProgress() {
  if (currentReaderId == null) return 0;
  const el = els.readerBody;
  const max = el.scrollHeight - el.clientHeight;
  const ratio = max > 0 ? Math.min(1, Math.max(0, el.scrollTop / max)) : 0;
  els.readerProgress.style.width = (ratio * 100) + '%';
  return ratio;
}
let progressTimer = null;
els.readerBody.addEventListener('scroll', () => {
  const ratio = updateReaderProgress();
  if (progressTimer) clearTimeout(progressTimer);
  progressTimer = setTimeout(() => {
    if (currentReaderId == null) return;
    meta.progress[currentReaderId] = { ratio: ratio, scroll: els.readerBody.scrollTop, lastReadAt: Date.now() };
    saveMeta();
  }, 250);
}, { passive: true });
els.readerFavBtn.addEventListener('click', () => {
  if (currentReaderId == null) return;
  toggleFav(currentReaderId);
  els.readerFavBtn.textContent = isFav(currentReaderId) ? '♥' : '♡';
  renderHome();
  showToast(isFav(currentReaderId) ? 'お気に入りにしましたわ' : 'お気に入りを外しましたわ');
});
els.readerEditBtn.addEventListener('click', () => {
  const novel = novels.find((n) => n.id === currentReaderId);
  if (novel) openEditor(novel);
});
els.tocBtn.addEventListener('click', () => {
  if (!currentChapters.length) { showToast('この作品には章見出しが見つかりませんでしたわ'); return; }
  const novel = novels.find((n) => n.id === currentReaderId);
  const total = novel ? (novel.body || '').length : 1;
  const chapters = detectChapters(novel ? novel.body : '');
  openSheet((box) => {
    box.appendChild(h('div', 'sheet-title', '目次（自動検出）'));
    chapters.forEach((c, i) => {
      const row = h('button', 'toc-row');
      row.appendChild(h('span', null, c.title));
      row.appendChild(h('small', null, Math.round((c.index / Math.max(1, total)) * 100) + '%'));
      row.addEventListener('click', () => {
        closeSheet();
        const entry = currentChapters[i];
        if (entry && entry.el) {
          const target = els.readerBody.scrollTop + entry.el.getBoundingClientRect().top - els.readerBody.getBoundingClientRect().top - 64;
          els.readerBody.scrollTo({ top: target, behavior: 'smooth' });
        }
      });
      box.appendChild(row);
    });
  });
});
els.readerSetBtn.addEventListener('click', () => {
  const s = meta.settings;
  openSheet((box) => {
    box.appendChild(h('div', 'sheet-title', '表示設定'));
    const mkRange = (label, min, max, step, val, fmt, onInput) => {
      const row = h('div', 'set-row');
      row.appendChild(h('span', null, label));
      const input = document.createElement('input');
      input.type = 'range';
      input.min = min; input.max = max; input.step = step; input.value = val;
      const disp = h('span', null, fmt(val));
      input.addEventListener('input', () => {
        disp.textContent = fmt(parseFloat(input.value));
        onInput(parseFloat(input.value));
      });
      row.appendChild(input);
      row.appendChild(disp);
      box.appendChild(row);
    };
    mkRange('文字サイズ', 14, 24, 1, s.fontSize, (v) => v + 'px', (v) => { meta.settings.fontSize = v; saveMeta(); applyReaderSettings(); });
    mkRange('行間', 1.6, 2.2, 0.1, s.lineHeight, (v) => Number(v).toFixed(1), (v) => { meta.settings.lineHeight = v; saveMeta(); applyReaderSettings(); });
    const mkSeg = (label, options, current, onPick) => {
      const row = h('div', 'set-row');
      row.appendChild(h('span', null, label));
      const seg = h('div', 'seg');
      options.forEach((pair) => {
        const b = h('button', pair[0] === current ? 'on' : '', pair[1]);
        b.addEventListener('click', () => {
          onPick(pair[0]);
          seg.querySelectorAll('button').forEach((x) => x.classList.remove('on'));
          b.classList.add('on');
        });
        seg.appendChild(b);
      });
      row.appendChild(seg);
      box.appendChild(row);
    };
    mkSeg('書体', [['serif', '明朝'], ['sans', 'ゴシック']], s.font, (v) => { meta.settings.font = v; saveMeta(); applyReaderSettings(); });
    mkSeg('テーマ', [['dark', 'ダーク'], ['sepia', 'セピア'], ['paper', '紙']], s.theme, (v) => { meta.settings.theme = v; saveMeta(); applyReaderSettings(); });
  });
});

/* ===== その他＆起動 ===== */
els.randomBtn.addEventListener('click', () => {
  if (!novels.length) { showToast('まだ本棚が空ですわ'); return; }
  const pick = novels[Math.floor(Math.random() * novels.length)];
  vibrate(30);
  showToast('今日の一冊はこれですわ');
  openReader(pick.id);
});
els.homeTitle.addEventListener('click', () => {
  currentTagFilter = null;
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
els.sortSelect.addEventListener('change', () => {
  sortMode = els.sortSelect.value;
  renderShelf();
});
history.replaceState({ page: 'home' }, '');
window.addEventListener('DOMContentLoaded', async () => {
  try {
    await initDB();
    await reloadNovels();
  } catch (e) {
    showToast('書庫を開けませんでしたわ……');
  }
  renderHome();
  setTimeout(() => { const sp = $('splash'); if (sp) sp.classList.add('hide'); }, 650);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
});
</script>
</body>
</html>
